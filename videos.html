<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos | Havik</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-page="videos">
    <div class="app">
        <aside class="sidebar">
            <div class="side-logo">H.</div>
            <a href="index.html" class="side-icon" data-page="home" title="Dashboard"><i class="fas fa-house"></i><span class="tip">Dashboard</span></a>
            <a href="index.html" class="side-icon" data-page="courses" title="Courses"><i class="fas fa-book-open"></i><span class="tip">Courses</span></a>
            <a href="videos.html" class="side-icon active" data-page="videos" title="Videos"><i class="fas fa-play"></i><span class="tip">Videos</span></a>
            <a href="contact.html" class="side-icon" data-page="contact" title="Contact"><i class="fas fa-envelope"></i><span class="tip">Contact</span></a>
            <div class="side-spacer"></div>
            <a href="mailto:iminfinity583@gmail.com" class="side-icon" title="Support"><i class="fas fa-circle-question"></i><span class="tip">Support</span></a>
        </aside>
        <main class="main">
            <div class="topbar">
                <div class="brand">
                    <h1>Havik Dashboard</h1>
                    <p>Media library</p>
                </div>
                <div class="top-actions">
                    <a href="javascript:history.length > 1 ? history.back() : location.href='index.html'" class="back-btn" title="Go back"><i class="fas fa-arrow-left"></i></a>
                    <input type="text" class="search" placeholder="Search videos...">
                    <div class="avatar">H</div>
                </div>
            </div>

            <section class="hero" data-reveal>
                <div class="hero-content">
                    <span class="badge">Media</span>
                    <h2>Videos</h2>
                    <p>Watch our latest videos.</p>
                    <a href="index.html" class="btn btn-solid"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
                </div>
            </section>

            <div class="grid">
                <div class="video-card" data-reveal>
                    <video controls preload="metadata" src="videos/VID-20260805-WA0000.mp4"></video>
                    <p><i class="fas fa-play" style="color:var(--accent);"></i> Video 1</p>
                </div>
                <div class="video-card" data-reveal>
                    <video controls preload="metadata" src="videos/VID-20260805-WA0002.mp4"></video>
                    <p><i class="fas fa-play" style="color:var(--accent);"></i> Video 2</p>
                </div>
                <div class="video-card" data-reveal>
                    <video controls preload="metadata" src="videos/VID-20260812-WA0015.mp4"></video>
                    <p><i class="fas fa-play" style="color:var(--accent);"></i> Video 3</p>
                </div>
            </div>
        </main>
    </div>
    <div class="mobile-toggle" data-sidebar-toggle><button><i class="fas fa-bars"></i></button></div>
    <footer class="footer">
        <p>&copy; <span id="year"></span> Havik. All rights reserved. · <a href="mailto:iminfinity583@gmail.com">iminfinity583@gmail.com</a></p>
    </footer>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    <script src="js/dashboard.js"></script>
</body>
</html>
